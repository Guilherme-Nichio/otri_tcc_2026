<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Light Off-white / Cream Base #F7F5F0 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F5F0" />
      <stop offset="50%" stop-color="#EDE9E1" />
      <stop offset="100%" stop-color="#F7F5F0" />
    </linearGradient>

    <!-- Emerald / Teal Tech Glow Gradient -->
    <radialGradient id="emeraldGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="45%" stop-color="#059669" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#F7F5F0" stop-opacity="0" />
    </radialGradient>

    <!-- Cyan Ambient Glow -->
    <radialGradient id="cyanGlow" cx="75%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#0284C7" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#F7F5F0" stop-opacity="0" />
    </radialGradient>

    <!-- Tech Grid Lines -->
    <pattern id="gridPattern" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#059669" stroke-opacity="0.08" stroke-width="1" />
      <circle cx="48" cy="48" r="1.5" fill="#10B981" fill-opacity="0.3" />
    </pattern>

    <!-- Organic Leaf / Avocado Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="avocadoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <!-- Base background #F7F5F0 -->
  <rect width="1440" height="900" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <rect width="1440" height="900" fill="url(#gridPattern)" />

  <!-- Radial glows -->
  <rect width="1440" height="900" fill="url(#emeraldGlow)" />
  <rect width="1440" height="900" fill="url(#cyanGlow)" />

  <!-- ================= NUTRITION GRAPHICS (Leaves, Avocado & Apple Silhouettes) ================= -->
  <!-- Left Side: Avocado Silhouette & Tech Orbit -->
  <g opacity="0.6" transform="translate(100, 160) scale(1.1)">
    <!-- Avocado Outer Contour -->
    <path d="M 120 40 C 180 40, 230 110, 230 200 C 230 280, 180 340, 120 340 C 60 340, 10 280, 10 200 C 10 110, 60 40, 120 40 Z" 
          fill="url(#avocadoGrad)" stroke="#059669" stroke-width="2" opacity="0.7" />
    <!-- Seed / Core Molecule -->
    <circle cx="120" cy="220" r="42" fill="none" stroke="#047857" stroke-width="1.8" stroke-dasharray="4,4" />
    <circle cx="120" cy="220" r="14" fill="#059669" opacity="0.3" />
    <!-- Tech Rings around Seed -->
    <circle cx="120" cy="220" r="60" fill="none" stroke="#10B981" stroke-width="1" opacity="0.4" />
  </g>

  <!-- Left Side: Organic Leaves -->
  <g opacity="0.55" transform="translate(260, 120) scale(1.3) rotate(-15)">
    <path d="M 60 180 C 60 90, 150 40, 200 40 C 200 130, 150 220, 60 180 Z" fill="url(#leafGrad)" stroke="#059669" stroke-width="1.8" />
    <path d="M 60 180 Q 130 110 200 40" fill="none" stroke="#059669" stroke-width="1.2" stroke-dasharray="3,3" />
  </g>

  <!-- Right Side: Apple / Fruit Tech Outline -->
  <g opacity="0.55" transform="translate(1080, 180) scale(1.2) rotate(15)">
    <!-- Leaf on top -->
    <path d="M 130 40 C 130 20, 160 10, 180 10 C 180 30, 160 50, 130 40 Z" fill="url(#leafGrad)" stroke="#0D9488" stroke-width="1.5" />
    <!-- Apple Body -->
    <path d="M 130 60 C 170 30, 240 70, 230 150 C 220 220, 170 260, 130 240 C 90 260, 40 220, 30 150 C 20 70, 90 30, 130 60 Z" 
          fill="url(#avocadoGrad)" stroke="#0D9488" stroke-width="2" />
    <!-- Tech Data Nodes inside Apple -->
    <circle cx="130" cy="140" r="5" fill="#0D9488" />
    <path d="M 80 120 L 130 140 L 180 110 M 130 140 L 130 190" fill="none" stroke="#0D9488" stroke-width="1.2" stroke-dasharray="3,3" />
  </g>

  <!-- ================= TECHNOLOGY & AI GRAPHICS (Circuit Paths, Hexagons, Pulse Rays) ================= -->
  <g opacity="0.65">
    <!-- Main AI Connection Arc across screen -->
    <path d="M 100 280 Q 380 120 720 260 T 1340 240" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6,6" opacity="0.5" />
    <path d="M 80 540 Q 450 680 820 490 T 1380 580" fill="none" stroke="#0D9488" stroke-width="1.8" stroke-dasharray="5,5" opacity="0.4" />

    <!-- Interactive AI Nodes with Glowing Rings -->
    <g transform="translate(420, 180)">
      <circle cx="0" cy="0" r="5" fill="#059669" />
      <circle cx="0" cy="0" r="14" fill="none" stroke="#059669" stroke-width="1" opacity="0.6" />
    </g>

    <g transform="translate(720, 260)">
      <circle cx="0" cy="0" r="6" fill="#10B981" />
      <circle cx="0" cy="0" r="22" fill="none" stroke="#10B981" stroke-width="1" stroke-dasharray="4,4" opacity="0.5" />
    </g>

    <g transform="translate(1020, 210)">
      <circle cx="0" cy="0" r="5" fill="#0284C7" />
      <circle cx="0" cy="0" r="15" fill="none" stroke="#0284C7" stroke-width="1" opacity="0.6" />
    </g>

    <!-- Floating Hexagonal Nutrient Structures -->
    <g opacity="0.5" transform="translate(280, 460)">
      <polygon points="36,0 72,20 72,60 36,80 0,60 0,20" fill="none" stroke="#059669" stroke-width="1.5" />
      <circle cx="36" cy="40" r="4" fill="#059669" />
    </g>

    <g opacity="0.45" transform="translate(1180, 500)">
      <polygon points="40,0 80,23 80,69 40,92 0,69 0,23" fill="none" stroke="#0284C7" stroke-width="1.5" />
      <circle cx="40" cy="46" r="4" fill="#0284C7" />
    </g>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="280" cy="220" r="3" fill="#10B981" opacity="0.8" />
  <circle cx="580" cy="140" r="2.5" fill="#38BDF8" opacity="0.7" />
  <circle cx="880" cy="280" r="3" fill="#10B981" opacity="0.6" />
  <circle cx="1140" cy="360" r="2" fill="#34D399" opacity="0.8" />
</svg>
